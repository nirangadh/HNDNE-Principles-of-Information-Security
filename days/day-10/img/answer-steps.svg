<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="as-t as-d"><title id="as-t">Explain, apply, weigh</title><desc id="as-d">Three steps rising from left to right. Step 1, explain: say what the mechanism is and how it works. Step 2, apply: use it on the setting in the question. Step 3, weigh: judge a choice and say what it costs. Each step stands on the one below.</desc><rect width="640" height="300" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">THREE PARTS, RISING IN DEMAND</text><rect x="20" y="180" width="196" height="90" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2.5"/><rect x="20" y="180" width="196" height="8" fill="#9C2C3A"/><text x="34" y="214" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#9C2C3A">1. Explain</text><text x="34" y="238" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">say what the mechanism is</text><text x="34" y="254" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">and how it works</text><rect x="224" y="120" width="196" height="150" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2.5"/><rect x="224" y="120" width="196" height="8" fill="#9C2C3A"/><text x="238" y="154" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#9C2C3A">2. Apply</text><text x="238" y="178" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">use it on the setting</text><text x="238" y="194" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">in the question</text><rect x="428" y="60" width="196" height="210" rx="6" fill="#F3E2E4" stroke="#2A1A1D" stroke-width="2.5"/><rect x="428" y="60" width="196" height="8" fill="#9C2C3A"/><text x="442" y="94" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#9C2C3A">3. Weigh</text><text x="442" y="118" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">judge a choice and say</text><text x="442" y="134" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">what it costs</text><path d="M20 270 L620 270" stroke="#2A1A1D" stroke-width="3"/><text x="20" y="292" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">Each step stands on the one before it.</text></svg>
