<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="tl-t tl-d"><title id="tl-t">Two lists that look alike</title><desc id="tl-d">Two keys on one ring. The upper key carries five lettered chips: C for confidentiality, I for integrity, A for availability, Au for authenticity and Ac for accountability, labelled what must hold. The lower key carries three chips: authorisation, authentication and accounting, labelled how a system checks and records. Dotted lines join authentication to authenticity and accounting to accountability, with the words supports, but is not.</desc><rect width="640" height="360" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">TWO KEYS ON ONE RING</text><circle cx="64" cy="92" r="34" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="4"/><circle cx="64" cy="92" r="12" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="3"/><rect x="98" y="68" width="520" height="48" rx="8" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2.5"/><text x="98" y="58" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">Five properties</text><text x="216" y="58" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">what must hold</text><rect x="108" y="74" width="94" height="36" rx="6" fill="#203A61"/><text x="155" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">C</text><text x="155" y="105" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFBFB">confidentiality</text><rect x="210" y="74" width="94" height="36" rx="6" fill="#1E7657"/><text x="257" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">I</text><text x="257" y="105" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFBFB">integrity</text><rect x="312" y="74" width="94" height="36" rx="6" fill="#7D4C15"/><text x="359" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">A</text><text x="359" y="105" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFBFB">availability</text><rect x="414" y="74" width="94" height="36" rx="6" fill="#6E3A99"/><text x="461" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Au</text><text x="461" y="105" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFBFB">authenticity</text><rect x="516" y="74" width="94" height="36" rx="6" fill="#445A67"/><text x="563" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Ac</text><text x="563" y="105" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFBFB">accountability</text><circle cx="64" cy="262" r="34" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="4"/><circle cx="64" cy="262" r="12" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="3"/><rect x="98" y="238" width="520" height="48" rx="8" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2.5"/><text x="98" y="228" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">Three processes</text><text x="228" y="228" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">how a system checks and records</text><rect x="414" y="244" width="94" height="36" rx="6" fill="#2A1A1D"/><text x="461" y="267" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFBFB">authentication</text><rect x="108" y="244" width="94" height="36" rx="6" fill="#2A1A1D"/><text x="155" y="267" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFBFB">authorisation</text><rect x="516" y="244" width="94" height="36" rx="6" fill="#2A1A1D"/><text x="563" y="267" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFBFB">accounting</text><path d="M461 114 L461 240" stroke="#9C2C3A" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/><path d="M563 114 L563 240" stroke="#9C2C3A" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/><text x="450" y="176" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">supports,</text><text x="450" y="192" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">but is not</text><text x="20" y="330" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Authentication helps protect authenticity. Accounting gives you accountability.</text><text x="20" y="350" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">Each pair is two different things, on two different lists.</text></svg>
