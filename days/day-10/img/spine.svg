<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="sp-t sp-d"><title id="sp-t">The spine: nine floors</title><desc id="sp-d">Nine floors of a building, Day 1 at the bottom and Day 9 at the top. Each floor names its one idea and the register items it added, and says what it rests on. Day 1, what we protect, is the ground. Days 2 and 3 rest on Day 1. Day 4's signatures rest on Days 2 and 3 together. Day 5's processes rest on Days 1 and 4. Day 6 rests on Day 5; Day 7 on Days 4 and 5; Day 8 on Days 2 and 5; Day 9 on Days 1 and 5.</desc><rect width="640" height="540" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">THE SPINE: NINE FLOORS</text><rect x="20" y="52" width="600" height="44" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="20" y="52" width="72" height="44" rx="6" fill="#2A1A1D"/><text x="56" y="80" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Day 9</text><text x="104" y="71" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Attacks, risk and continuity</text><text x="104" y="89" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">items 18, 19</text><text x="606" y="80" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">rests on Days 1 and 5</text><rect x="20" y="102" width="600" height="44" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="20" y="102" width="72" height="44" rx="6" fill="#2A1A1D"/><text x="56" y="130" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Day 8</text><text x="104" y="121" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Network zones and firewalls</text><text x="104" y="139" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">items 15 to 17</text><text x="606" y="130" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">rests on Days 2 and 5</text><rect x="20" y="152" width="600" height="44" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="20" y="152" width="72" height="44" rx="6" fill="#2A1A1D"/><text x="56" y="180" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Day 7</text><text x="104" y="171" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Email checks and database accounts</text><text x="104" y="189" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">items 13, 14</text><text x="606" y="180" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">rests on Days 4 and 5</text><rect x="20" y="202" width="600" height="44" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="20" y="202" width="72" height="44" rx="6" fill="#2A1A1D"/><text x="56" y="230" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Day 6</text><text x="104" y="221" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Web input and sessions</text><text x="104" y="239" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">items 11, 12</text><text x="606" y="230" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">rests on Day 5</text><rect x="20" y="252" width="600" height="44" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="20" y="252" width="72" height="44" rx="6" fill="#2A1A1D"/><text x="56" y="280" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Day 5</text><text x="104" y="271" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Who may do what: the three processes</text><text x="104" y="289" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">items 9, 10</text><text x="606" y="280" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">rests on Days 1 and 4</text><rect x="20" y="302" width="600" height="44" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="20" y="302" width="72" height="44" rx="6" fill="#2A1A1D"/><text x="56" y="330" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Day 4</text><text x="104" y="321" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Proving who: signatures and certificates</text><text x="104" y="339" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">items 7, 8</text><text x="606" y="330" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">rests on Days 2 and 3</text><rect x="20" y="352" width="600" height="44" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="20" y="352" width="72" height="44" rx="6" fill="#2A1A1D"/><text x="56" y="380" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Day 3</text><text x="104" y="371" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Fingerprints: hashing and salting</text><text x="104" y="389" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">items 5, 6</text><text x="606" y="380" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">rests on Day 1</text><rect x="20" y="402" width="600" height="44" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="20" y="402" width="72" height="44" rx="6" fill="#2A1A1D"/><text x="56" y="430" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Day 2</text><text x="104" y="421" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Secrecy with keys: symmetric, asymmetric, hybrid</text><text x="104" y="439" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">items 3, 4</text><text x="606" y="430" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">rests on Day 1</text><rect x="20" y="452" width="600" height="44" rx="6" fill="#F3E2E4" stroke="#9C2C3A" stroke-width="2"/><rect x="20" y="452" width="72" height="44" rx="6" fill="#2A1A1D"/><text x="56" y="480" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Day 1</text><text x="104" y="471" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">What we protect: data, the five properties, risk</text><text x="104" y="489" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">items 1, 2</text><text x="606" y="480" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">the ground</text><rect x="20" y="502" width="600" height="8" fill="#9C2C3A"/><text x="320" y="532" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">Read it from the bottom: each floor stands on the ones it names.</text></svg>
