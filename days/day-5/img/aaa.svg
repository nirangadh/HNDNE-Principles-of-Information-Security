<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="aaa-t aaa-d"><title id="aaa-t">Three gates, and the property accounting produces</title><desc id="aaa-d">Three gates in a row. Gate 1, authentication, asks who are you. Gate 2, authorisation, asks what may you do. Gate 3, accounting, asks what did you do, and writes into a log. Below the log, an arrow points to the accountability property, marked Ac.</desc><rect width="640" height="360" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">THREE PROCESSES, IN ORDER</text><rect x="20" y="48" width="180" height="108" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="20" y="48" width="180" height="30" rx="10" fill="#9C2C3A"/><rect x="20" y="66" width="180" height="12" fill="#9C2C3A"/><text x="34" y="69" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFBFB">Gate 1</text><text x="34" y="106" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#2A1A1D">Authentication</text><text x="34" y="132" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#6C5353">Who are you?</text><path d="M204 102 L218 102" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M226 102 L217 96 L217 108 Z" fill="#9C2C3A"/><rect x="230" y="48" width="180" height="108" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="230" y="48" width="180" height="30" rx="10" fill="#9C2C3A"/><rect x="230" y="66" width="180" height="12" fill="#9C2C3A"/><text x="244" y="69" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFBFB">Gate 2</text><text x="244" y="106" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#2A1A1D">Authorisation</text><text x="244" y="132" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#6C5353">What may you do?</text><path d="M414 102 L428 102" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M436 102 L427 96 L427 108 Z" fill="#9C2C3A"/><rect x="440" y="48" width="180" height="108" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="440" y="48" width="180" height="30" rx="10" fill="#2A1A1D"/><rect x="440" y="66" width="180" height="12" fill="#2A1A1D"/><text x="454" y="69" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFBFB">Gate 3</text><text x="454" y="106" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#2A1A1D">Accounting</text><text x="454" y="132" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#6C5353">What did you do?</text><path d="M530 160 L530 184" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M530 192 L524 183 L536 183 Z" fill="#2A1A1D"/><rect x="440" y="194" width="180" height="92" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="452" y="214" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The log</text><text x="452" y="236" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">lecturer01 entered a grade</text><text x="452" y="254" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">student01: change refused</text><text x="452" y="272" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">who, what, when</text><path d="M530 290 L530 306" stroke="#445A67" stroke-width="2.5" fill="none"/><path d="M530 314 L524 305 L536 305 Z" fill="#445A67"/><rect x="440" y="316" width="180" height="34" rx="17" fill="#445A67"/><text x="458" y="338" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFBFB">Ac</text><text x="484" y="338" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFBFB">Accountability</text><text x="20" y="214" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#9C2C3A">Each gate can fail on its own.</text><text x="20" y="238" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">These are processes: steps a system runs.</text><text x="20" y="258" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">The five properties from Day 1 are a</text><text x="20" y="276" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">different list: what must be true.</text><text x="20" y="312" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Accounting is the process that</text><text x="20" y="330" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">produces the accountability property.</text></svg>
