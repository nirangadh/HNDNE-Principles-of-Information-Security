<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" role="img" aria-labelledby="rb-t rb-d"><title id="rb-t">Role-based access control</title><desc id="rb-d">Three columns. On the left, people: lecturer01, student01 and registrar. In the middle, roles: lecturer, student, Registrar. On the right, permissions: enter and read grades for own modules, read own record, approve a change to a released grade, read who changed what. Each person is assigned to one role, and each role carries its permissions; no line runs from a person straight to a permission.</desc><rect width="640" height="384" fill="#FFFBFB"/><text x="80" y="32" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#6C5353">PEOPLE</text><text x="300" y="32" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#6C5353">ROLES</text><text x="510" y="32" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#6C5353">PERMISSIONS</text><path d="M370 80 L410 80 L410 64 L420 64" stroke="#9C2C3A" stroke-width="2" fill="none"/><path d="M370 80 L410 80 L410 124 L420 124" stroke="#9C2C3A" stroke-width="2" fill="none"/><path d="M370 190 L410 190 L410 190 L420 190" stroke="#9C2C3A" stroke-width="2" fill="none"/><path d="M370 300 L410 300 L410 252 L420 252" stroke="#9C2C3A" stroke-width="2" fill="none"/><path d="M370 300 L410 300 L410 314 L420 314" stroke="#9C2C3A" stroke-width="2" fill="none"/><rect x="20" y="60" width="120" height="40" rx="20" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="80" y="85" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">lecturer01</text><path d="M144 80 L218 80" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M226 80 L217 74 L217 86 Z" fill="#2A1A1D"/><rect x="230" y="58" width="140" height="44" rx="8" fill="#9C2C3A"/><text x="300" y="85" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFBFB">Lecturer role</text><rect x="20" y="170" width="120" height="40" rx="20" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="80" y="195" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">student01</text><path d="M144 190 L218 190" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M226 190 L217 184 L217 196 Z" fill="#2A1A1D"/><rect x="230" y="168" width="140" height="44" rx="8" fill="#9C2C3A"/><text x="300" y="195" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFBFB">Student role</text><rect x="20" y="280" width="120" height="40" rx="20" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="80" y="305" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">registrar</text><path d="M144 300 L218 300" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M226 300 L217 294 L217 306 Z" fill="#2A1A1D"/><rect x="230" y="278" width="140" height="44" rx="8" fill="#9C2C3A"/><text x="300" y="305" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFBFB">Registrar role</text><rect x="420" y="40" width="200" height="48" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="432" y="61" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">Enter grades for</text><text x="432" y="79" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">own modules</text><rect x="420" y="100" width="200" height="48" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="432" y="121" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">Read grades for</text><text x="432" y="139" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">own modules</text><rect x="420" y="166" width="200" height="48" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="432" y="195" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">Read own record</text><rect x="420" y="228" width="200" height="48" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="432" y="249" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">Approve a change to</text><text x="432" y="267" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">a released grade</text><rect x="420" y="290" width="200" height="48" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="432" y="311" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">Read who changed</text><text x="432" y="329" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1A1D">what</text><text x="20" y="352" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">People get roles. Roles carry the permissions.</text><text x="20" y="370" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">No line runs from a person straight to a permission.</text></svg>
