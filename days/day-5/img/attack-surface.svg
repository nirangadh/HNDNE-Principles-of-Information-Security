<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="as-t as-d"><title id="as-t">Hardening shrinks the attack surface</title><desc id="as-d">A server before and after hardening. Before: the needed SIS application, an unused service with its port open, a system file every account can change, and a journal that records nothing. After: only the needed service runs, the file has its safe mode, and the journal records every action.</desc><rect width="640" height="330" fill="#FFFBFB"/><rect x="12" y="12" width="300" height="270" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="162" y="40" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#2A1A1D">BEFORE: YOUR BASELINE</text><rect x="328" y="12" width="300" height="270" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="478" y="40" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#2A1A1D">AFTER: HARDENED</text><circle cx="34" cy="76" r="11" fill="#9C2C3A"/><path d="M29 76 L33 80 L40 72" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="54" y="73" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The SIS application</text><text x="54" y="90" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">needed: kept running</text><rect x="23" y="113" width="22" height="22" rx="3" fill="#E0663C"/><path d="M29 119 L39 129 M39 119 L29 129" stroke="#2A1A1D" stroke-width="2.5"/><text x="54" y="121" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">An unused service</text><text x="54" y="138" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">running, its port open</text><rect x="23" y="161" width="22" height="22" rx="3" fill="#E0663C"/><path d="M29 167 L39 177 M39 167 L29 177" stroke="#2A1A1D" stroke-width="2.5"/><text x="54" y="169" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">A system file</text><text x="54" y="186" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">mode 666: every account may change it</text><rect x="23" y="209" width="22" height="22" rx="3" fill="#E0663C"/><path d="M29 215 L39 225 M39 215 L29 225" stroke="#2A1A1D" stroke-width="2.5"/><text x="54" y="217" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The journal</text><text x="54" y="234" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">set to keep nothing</text><text x="30" y="266" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">Open ways in: 2. Recorded: no.</text><circle cx="350" cy="76" r="11" fill="#9C2C3A"/><path d="M345 76 L349 80 L356 72" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="370" y="73" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The SIS application</text><text x="370" y="90" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">needed: kept running</text><circle cx="350" cy="124" r="11" fill="#9C2C3A"/><path d="M345 124 L349 128 L356 120" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="370" y="121" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The unused service</text><text x="370" y="138" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">disabled, its port closed</text><circle cx="350" cy="172" r="11" fill="#9C2C3A"/><path d="M345 172 L349 176 L356 168" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="370" y="169" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The system file</text><text x="370" y="186" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">safe mode 600 or 644</text><circle cx="350" cy="220" r="11" fill="#9C2C3A"/><path d="M345 220 L349 224 L356 216" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="370" y="217" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The journal</text><text x="370" y="234" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">records every action</text><text x="346" y="266" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">Open ways in: 0. Recorded: yes.</text><text x="20" y="312" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">Turning things off shrinks the attack surface. Logging adds no lock; it lets you trace.</text></svg>
