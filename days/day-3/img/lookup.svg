<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="lk-t lk-d"><title id="lk-t">A salt keeps a password out of the table</title><desc id="lk-d">On the right, a lookup table of common passwords beside their SHA-256 digests, computed in advance. On the left, the same password stored two ways. With no salt, its digest matches the row for password123, so the password is known. With the salt 5b02a8f8 added, its digest is in no row, so nothing is found.</desc><rect width="640" height="360" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">A LOOKUP TABLE, BUILT IN ADVANCE</text><rect x="340" y="46" width="280" height="170" rx="8" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="354" y="70" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">digest</text><text x="500" y="70" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">password</text><text x="354" y="100" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">8d969eef...</text><text x="500" y="100" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">123456</text><text x="354" y="130" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">1c8bfe8f...</text><text x="500" y="130" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">letmein</text><rect x="346" y="141" width="268" height="27" rx="4" fill="#F3E2E4" stroke="#9C2C3A" stroke-width="2"/><text x="354" y="160" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">ef92b778...</text><text x="500" y="160" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">password123</text><text x="354" y="190" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">3eb9a7b7...</text><text x="500" y="190" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">taxila123</text><text x="354" y="238" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">about a hundred rows; real tables hold millions</text><rect x="20" y="84" width="270" height="58" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="32" y="106" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Stored with no salt</text><text x="32" y="128" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">ef92b778bafe771e...</text><path d="M290 113 L320 113 L320 151 L334 151" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M342 151 L333 145 L333 157 Z" fill="#9C2C3A"/><rect x="21" y="153" width="22" height="22" rx="3" fill="#E0663C"/><path d="M27 159 L37 169 M37 159 L27 169" stroke="#2A1A1D" stroke-width="2.5"/><text x="50" y="169" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">found: the password is known</text><rect x="20" y="214" width="270" height="76" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="32" y="236" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Stored with the salt 5b02a8f8</text><text x="32" y="258" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">a0b12530aefa1e72...</text><text x="32" y="280" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">same password, salt written after it</text><circle cx="32" cy="312" r="11" fill="#9C2C3A"/><path d="M27 312 L31 316 L38 308" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="50" y="317" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">not found: nobody computed it in advance</text><text x="20" y="346" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">The table never reverses a digest. It only matches digests that someone hashed in advance.</text></svg>
