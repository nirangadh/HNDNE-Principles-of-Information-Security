<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="sl-t sl-d"><title id="sl-t">A plain digest against a keyed seal</title><desc id="sl-d">Two columns. In both, someone without the office key changes a mark from 50 to 59. On the left, they remake the plain digest, which needs no key; the new digest matches the changed file, so the change is hidden. On the right, they try to make an HMAC seal without the key; the office checks it with its key, it does not match, and the change is found.</desc><rect width="640" height="380" fill="#FFFBFB"/><rect x="12" y="12" width="300" height="300" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><rect x="328" y="12" width="300" height="300" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="162" y="40" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#2A1A1D">A PLAIN DIGEST</text><text x="478" y="40" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#2A1A1D">AN HMAC SEAL</text><rect x="28" y="58" width="268" height="54" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="40" y="80" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The mark is changed: 50 to 59</text><text x="40" y="100" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">by someone without the office key</text><path d="M162 112 L162 124" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M162 132 L156 123 L168 123 Z" fill="#2A1A1D"/><rect x="344" y="58" width="268" height="54" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="356" y="80" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The mark is changed: 50 to 59</text><text x="356" y="100" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">by someone without the office key</text><path d="M478 112 L478 124" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M478 132 L472 123 L484 123 Z" fill="#2A1A1D"/><rect x="28" y="134" width="268" height="54" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="40" y="156" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">They remake the digest</text><text x="40" y="176" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">anyone can: SHA-256 needs no key</text><path d="M162 188 L162 200" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M162 208 L156 199 L168 199 Z" fill="#2A1A1D"/><rect x="28" y="210" width="268" height="54" rx="6" fill="#FFFBFB" stroke="#E0663C" stroke-width="1.5"/><text x="40" y="232" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The new digest matches</text><text x="40" y="252" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">the changed file perfectly</text><rect x="29" y="277" width="22" height="22" rx="3" fill="#E0663C"/><path d="M35 283 L45 293 M45 283 L35 293" stroke="#2A1A1D" stroke-width="2.5"/><text x="58" y="293" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">the change is hidden</text><rect x="344" y="134" width="268" height="54" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="356" y="156" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">They try to make a seal</text><text x="356" y="176" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">without the key, any seal is wrong</text><path d="M478 188 L478 200" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M478 208 L472 199 L484 199 Z" fill="#2A1A1D"/><rect x="344" y="210" width="268" height="54" rx="6" fill="#FFFBFB" stroke="#9C2C3A" stroke-width="1.5"/><text x="356" y="232" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The office checks it with its key</text><text x="356" y="252" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">it does not match</text><circle cx="356" cy="288" r="11" fill="#9C2C3A"/><path d="M351 288 L355 292 L362 284" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="374" y="293" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">the change is found</text><text x="20" y="340" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">A plain digest helps only if it is kept where the changer cannot reach it.</text><text x="20" y="364" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#6C5353">A seal needs the key, so only a key-holder can make one that matches.</text></svg>
