<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="ax-t ax-d"><title id="ax-t">Two events on three axes</title><desc id="ax-d">Two rows, one per event, answered on three questions. The changed grade in the SIS is marked active, insider and targeted. A mass phishing run, one message to thousands, is marked active, outsider and opportunistic. Below, the controls that fit each profile: least privilege and a second approver for the changed grade; awareness and email checks for the phishing run.</desc><rect width="640" height="330" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">TWO EVENTS, THREE QUESTIONS</text><text x="262" y="62" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">Watch or act?</text><text x="228" y="86" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">passive</text><text x="296" y="86" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">active</text><text x="404" y="62" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">Inside or outside?</text><text x="370" y="86" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">insider</text><text x="438" y="86" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">outsider</text><text x="546" y="62" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">Chosen or not?</text><text x="512" y="86" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">targeted</text><text x="580" y="86" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">opportunistic</text><rect x="20" y="108" width="600" height="72" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="2"/><text x="34" y="140" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#2A1A1D">The changed grade</text><text x="34" y="160" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">a grade altered in the SIS</text><rect x="200" y="128" width="56" height="32" rx="16" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="2" stroke-dasharray="4 4"/><rect x="268" y="128" width="56" height="32" rx="16" fill="#9C2C3A"/><path d="M289 144 L294 149 L304 138" stroke="#FFFBFB" stroke-width="3" fill="none"/><rect x="342" y="128" width="56" height="32" rx="16" fill="#9C2C3A"/><path d="M363 144 L368 149 L378 138" stroke="#FFFBFB" stroke-width="3" fill="none"/><rect x="410" y="128" width="56" height="32" rx="16" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="2" stroke-dasharray="4 4"/><rect x="484" y="128" width="56" height="32" rx="16" fill="#9C2C3A"/><path d="M505 144 L510 149 L520 138" stroke="#FFFBFB" stroke-width="3" fill="none"/><rect x="552" y="128" width="56" height="32" rx="16" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="2" stroke-dasharray="4 4"/><rect x="20" y="198" width="600" height="72" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="2"/><text x="34" y="230" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#2A1A1D">A mass phishing run</text><text x="34" y="250" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">one message to thousands</text><rect x="200" y="218" width="56" height="32" rx="16" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="2" stroke-dasharray="4 4"/><rect x="268" y="218" width="56" height="32" rx="16" fill="#9C2C3A"/><path d="M289 234 L294 239 L304 228" stroke="#FFFBFB" stroke-width="3" fill="none"/><rect x="342" y="218" width="56" height="32" rx="16" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="2" stroke-dasharray="4 4"/><rect x="410" y="218" width="56" height="32" rx="16" fill="#9C2C3A"/><path d="M431 234 L436 239 L446 228" stroke="#FFFBFB" stroke-width="3" fill="none"/><rect x="484" y="218" width="56" height="32" rx="16" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="2" stroke-dasharray="4 4"/><rect x="552" y="218" width="56" height="32" rx="16" fill="#9C2C3A"/><path d="M573 234 L578 239 L588 228" stroke="#FFFBFB" stroke-width="3" fill="none"/><text x="20" y="296" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">Changed grade: active, insider, targeted. Least privilege and a second approver fit.</text><text x="20" y="316" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">Phishing run: active, outsider, opportunistic. Awareness and email checks fit.</text></svg>
