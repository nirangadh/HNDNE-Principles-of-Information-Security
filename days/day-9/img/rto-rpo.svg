<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="rr-t rr-d"><title id="rr-t">One failure, two windows</title><desc id="rr-d">A timeline. On the left, the last good backup; in the middle, the failure, marked in red; on the right, the moment the service is back. The window from the last backup to the failure is the data lost, which must not exceed the recovery point objective, RPO. The window from the failure to recovery is the time the service is down, which must not exceed the recovery time objective, RTO. The RPO sets how often you back up; the RTO sets how fast you must restore. Taxila today has one weekly disk, so up to a week of grades sits in the first window.</desc><rect width="640" height="300" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">ONE FAILURE, TWO WINDOWS</text><path d="M30 130 L610 130" stroke="#2A1A1D" stroke-width="2.5"/><rect x="80" y="104" width="250" height="52" fill="#F3E2E4" stroke="#E0663C" stroke-width="2" stroke-dasharray="7 5"/><rect x="330" y="104" width="210" height="52" fill="#E4D5D5" stroke="#6C5353" stroke-width="2"/><path d="M80 90 L80 170 M540 90 L540 170" stroke="#2A1A1D" stroke-width="3"/><path d="M330 80 L330 180" stroke="#E0663C" stroke-width="4"/><text x="80" y="80" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">last good backup</text><text x="330" y="72" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">failure</text><text x="540" y="80" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">service back</text><text x="205.0" y="135" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">data lost</text><text x="435.0" y="135" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">service down</text><path d="M80 192 L80 202 L330 202 L330 192" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M330 192 L330 202 L540 202 L540 192" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><text x="205.0" y="224" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">must not exceed the recovery point</text><text x="205.0" y="240" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">objective (RPO)</text><text x="435.0" y="224" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">must not exceed the recovery time</text><text x="435.0" y="240" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">objective (RTO)</text><text x="20" y="272" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">The RPO sets how often you back up. The RTO sets how fast you must restore.</text><text x="20" y="292" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">Taxila today: one weekly disk, so up to a week of grades sits in the first window.</text></svg>
