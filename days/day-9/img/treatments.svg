<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tr-t tr-d"><title id="tr-t">One risk, four treatments</title><desc id="tr-d">At the top, one risk: exam papers in a folder anyone can open, likelihood 3 times impact 5, score 15. Four arrows lead to four treatments, each with a residual risk bar out of 25. Mitigate, encrypt and limit the folder: residual 1 times 5, which is 5. Avoid, write papers on paper only: the folder risk is gone. Transfer, insurance pays for a rewrite: the bar stays at 15, because the leak still happens. Accept, a recorded, owned choice: 15 stays, too high here.</desc><rect width="640" height="400" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">ONE RISK, FOUR WAYS OUT</text><rect x="20" y="44" width="600" height="56" rx="10" fill="#F3E2E4" stroke="#9C2C3A" stroke-width="2"/><text x="36" y="68" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#2A1A1D">Exam papers in a folder anyone can open</text><text x="36" y="88" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">likelihood 3 x impact 5 = 15</text><path d="M93 104 L93 124" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M93 132 L87 123 L99 123 Z" fill="#2A1A1D"/><rect x="20" y="136" width="146" height="150" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="93" y="160" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#9C2C3A">Mitigate</text><text x="93" y="184" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">encrypt and limit</text><text x="93" y="200" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">the folder</text><text x="93" y="228" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">residual risk</text><rect x="33" y="238" width="120" height="12" rx="6" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="1.5"/><rect x="33" y="238" width="24.0" height="12" rx="6" fill="#6C5353"/><text x="93" y="272" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">1 x 5 = 5</text><path d="M245 104 L245 124" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M245 132 L239 123 L251 123 Z" fill="#2A1A1D"/><rect x="172" y="136" width="146" height="150" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="245" y="160" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#9C2C3A">Avoid</text><text x="245" y="184" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">write papers on</text><text x="245" y="200" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">paper only</text><text x="245" y="228" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">residual risk</text><rect x="185" y="238" width="120" height="12" rx="6" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="1.5"/><text x="245" y="272" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">the folder risk is gone</text><path d="M397 104 L397 124" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M397 132 L391 123 L403 123 Z" fill="#2A1A1D"/><rect x="324" y="136" width="146" height="150" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="397" y="160" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#9C2C3A">Transfer</text><text x="397" y="184" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">insurance pays for</text><text x="397" y="200" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">a rewrite</text><text x="397" y="228" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">residual risk</text><rect x="337" y="238" width="120" height="12" rx="6" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="1.5"/><rect x="337" y="238" width="72.0" height="12" rx="6" fill="#6C5353"/><text x="397" y="272" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">the leak still happens</text><path d="M549 104 L549 124" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M549 132 L543 123 L555 123 Z" fill="#2A1A1D"/><rect x="476" y="136" width="146" height="150" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="549" y="160" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#9C2C3A">Accept</text><text x="549" y="184" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">a recorded,</text><text x="549" y="200" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">owned choice</text><text x="549" y="228" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">residual risk</text><rect x="489" y="238" width="120" height="12" rx="6" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="1.5"/><rect x="489" y="238" width="72.0" height="12" rx="6" fill="#6C5353"/><text x="549" y="272" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">15 stays: too high here</text><text x="20" y="318" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">Mitigate fits best here: the likelihood falls, though the harm of one leak stays.</text><text x="20" y="340" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">Avoid removes the folder but brings printed papers that can leak too.</text><text x="20" y="360" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">Transfer moves the cost, not the harm: the paper must still be rewritten.</text><text x="20" y="380" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">Accept is a real choice only with an owner and a low enough score.</text></svg>
