<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ec-t ec-d"><title id="ec-t">Same block in, same block out</title><desc id="ec-d">Four plaintext blocks, three of them identical. In electronic code book mode each block is encrypted alone, so the three identical blocks give three identical ciphertext blocks and the pattern shows. In cipher block chaining mode each block is mixed with the ciphertext of the block before, so all four ciphertext blocks differ.</desc><rect width="640" height="360" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">THE SAME FOUR BLOCKS OF PLAINTEXT</text><text x="20" y="74" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A1A1D">Plaintext</text><rect x="168" y="44" width="96" height="46" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="216" y="73" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">EXAM</text><rect x="280" y="44" width="96" height="46" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="328" y="73" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">EXAM</text><rect x="392" y="44" width="96" height="46" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="440" y="73" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">PART</text><rect x="504" y="44" width="96" height="46" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="552" y="73" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">EXAM</text><text x="20" y="180" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A1A1D">ECB gives</text><rect x="168" y="150" width="96" height="46" rx="6" fill="#F3E2E4" stroke="#9C2C3A" stroke-width="3"/><text x="216" y="179" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">7f3a</text><rect x="280" y="150" width="96" height="46" rx="6" fill="#F3E2E4" stroke="#9C2C3A" stroke-width="3"/><text x="328" y="179" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">7f3a</text><rect x="392" y="150" width="96" height="46" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="440" y="179" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">c2e1</text><rect x="504" y="150" width="96" height="46" rx="6" fill="#F3E2E4" stroke="#9C2C3A" stroke-width="3"/><text x="552" y="179" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">7f3a</text><text x="20" y="286" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A1A1D">CBC gives</text><rect x="168" y="256" width="96" height="46" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="216" y="285" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">7f3a</text><rect x="280" y="256" width="96" height="46" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="328" y="285" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">91bd</text><rect x="392" y="256" width="96" height="46" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="440" y="285" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">04ce</text><rect x="504" y="256" width="96" height="46" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="552" y="285" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#2A1A1D">e85f</text><path d="M264 279 L278 279" stroke="#9C2C3A" stroke-width="3"/><path d="M280 279 L272 273 L272 285 Z" fill="#9C2C3A"/><path d="M376 279 L390 279" stroke="#9C2C3A" stroke-width="3"/><path d="M392 279 L384 273 L384 285 Z" fill="#9C2C3A"/><path d="M488 279 L502 279" stroke="#9C2C3A" stroke-width="3"/><path d="M504 279 L496 273 L496 285 Z" fill="#9C2C3A"/><text x="20" y="196" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">each block alone</text><text x="20" y="302" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">each block mixed</text><text x="20" y="317" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">with the one before</text><text x="168" y="128" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#6C5353">Encrypt the same four blocks in two modes:</text><text x="168" y="226" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">same in, same out: the pattern shows</text><text x="168" y="330" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">every block different: no pattern shows</text></svg>
