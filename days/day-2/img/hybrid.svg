<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="hy-t hy-d"><title id="hy-t">Two keys, one paper: the hybrid pattern</title><desc id="hy-d">Kandy on the left, Colombo on the right. Colombo has a key pair and sends only the public key to Kandy; the private key stays in Colombo. Kandy makes a fresh AES key, locks the AES key with Colombo's public key and locks the paper with the AES key, and sends both. Colombo opens the AES key with the private key, then opens the paper with the AES key.</desc><rect width="640" height="400" fill="#FFFBFB"/><rect x="12" y="12" width="212" height="304" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><rect x="416" y="12" width="212" height="304" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="118" y="40" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#2A1A1D">KANDY</text><text x="522" y="40" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#2A1A1D">COLOMBO</text><rect x="430" y="58" width="184" height="94" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="442" y="78" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Colombo's key pair</text><path d="M450.8 92.8 L450.8 85.6 Q456.4 77.6 462 85.6 L462 88.8" stroke="#9C2C3A" stroke-width="2.8" fill="none"/><rect x="446" y="96" width="20.8" height="16" rx="2.4" fill="#9C2C3A"/><text x="476" y="110" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">public: given away</text><circle cx="449" cy="131" r="6" fill="none" stroke="#2A1A1D" stroke-width="3"/><path d="M455 131 L472 131 M467 131 L467 136 M472 131 L472 136" stroke="#2A1A1D" stroke-width="3" fill="none"/><text x="476" y="136" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">private: kept here</text><path d="M430 102 L234 102" stroke="#9C2C3A" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/><path d="M226 102 L235 96 L235 108 Z" fill="#9C2C3A"/><text x="328" y="94" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">1. public key</text><rect x="26" y="78" width="184" height="50" rx="6" fill="#FFFBFB" stroke="#9C2C3A" stroke-width="2"/><path d="M42.8 102.8 L42.8 95.6 Q48.4 87.6 54 95.6 L54 98.8" stroke="#9C2C3A" stroke-width="2.8" fill="none"/><rect x="38" y="106" width="20.8" height="16" rx="2.4" fill="#9C2C3A"/><text x="68" y="108" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">Colombo's</text><text x="68" y="122" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">public key</text><rect x="26" y="150" width="184" height="50" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><circle cx="45" cy="175" r="6" fill="none" stroke="#2A1A1D" stroke-width="3"/><path d="M51 175 L68 175 M63 175 L63 180 M68 175 L68 180" stroke="#2A1A1D" stroke-width="3" fill="none"/><text x="76" y="172" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">a fresh AES key</text><text x="76" y="190" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">fast, symmetric</text><rect x="26" y="222" width="184" height="50" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="38" y="252" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">the exam paper</text><text x="38" y="266" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">long</text><rect x="248" y="166" width="144" height="58" rx="6" fill="#F3E2E4" stroke="#9C2C3A" stroke-width="2"/><text x="320" y="188" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">2. the AES key,</text><text x="320" y="206" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">locked with the</text><text x="320" y="220" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">public key</text><rect x="248" y="246" width="144" height="58" rx="6" fill="#F3E2E4" stroke="#2A1A1D" stroke-width="2"/><text x="320" y="268" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">3. the paper,</text><text x="320" y="286" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">locked with the</text><text x="320" y="300" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">AES key</text><path d="M210 194 L238 194" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M246 194 L237 188 L237 200 Z" fill="#2A1A1D"/><path d="M392 194 L420 194" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M428 194 L419 188 L419 200 Z" fill="#2A1A1D"/><path d="M210 274 L238 274" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M246 274 L237 268 L237 280 Z" fill="#2A1A1D"/><path d="M392 274 L420 274" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M428 274 L419 268 L419 280 Z" fill="#2A1A1D"/><rect x="430" y="166" width="184" height="58" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="442" y="188" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">opens the AES key</text><text x="442" y="206" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">with the private key</text><rect x="430" y="246" width="184" height="58" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="442" y="268" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">opens the paper</text><text x="442" y="286" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">with the AES key</text><path d="M522 224 L522 236" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M522 244 L516 235 L528 235 Z" fill="#2A1A1D"/><text x="20" y="344" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">The slow public-key step carries only a short key. The fast AES key carries the long paper.</text><text x="20" y="368" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#6C5353">Nothing secret travels unlocked, and the private key never leaves Colombo.</text></svg>
