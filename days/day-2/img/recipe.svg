<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="rc-t rc-d"><title id="rc-t">Your personal values, step by step</title><desc id="rc-d">Your index number goes through SHA-256 to make the key, 64 characters. Your index written backwards goes through SHA-256, and the first 32 characters are the starting value. AES-256 in CBC mode then encrypts your index with the key and the starting value, and gives the ciphertext. The example index COHNDNE999X000 gives a key starting 5b02a8f8, a starting value starting 0def7750 and the ciphertext bc6b159611b059c4db6b8eb5b1ac2add.</desc><rect width="640" height="330" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">FROM YOUR INDEX NUMBER TO YOUR CIPHERTEXT</text><rect x="20" y="46" width="180" height="56" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="30" y="68" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Your index</text><text x="30" y="90" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">COHNDNE999X000</text><rect x="20" y="136" width="180" height="56" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="30" y="158" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Written backwards</text><text x="30" y="180" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">000X999ENDNHOC</text><rect x="250" y="46" width="150" height="56" rx="6" fill="#F9EFEF" stroke="#2A1A1D" stroke-width="1.5"/><text x="260" y="68" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">SHA-256</text><text x="260" y="90" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">all 64 characters</text><rect x="250" y="136" width="150" height="56" rx="6" fill="#F9EFEF" stroke="#2A1A1D" stroke-width="1.5"/><text x="260" y="158" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">SHA-256</text><text x="260" y="180" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">first 32 only</text><rect x="450" y="46" width="170" height="56" rx="6" fill="#FFFBFB" stroke="#9C2C3A" stroke-width="1.5"/><text x="460" y="68" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Key</text><text x="460" y="90" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">5b02a8f8...bb99b</text><rect x="450" y="136" width="170" height="56" rx="6" fill="#FFFBFB" stroke="#9C2C3A" stroke-width="1.5"/><text x="460" y="158" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Starting value</text><text x="460" y="180" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">0def7750...e82b9</text><path d="M200 74 L240 74" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M248 74 L239 68 L239 80 Z" fill="#2A1A1D"/><path d="M400 74 L440 74" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M448 74 L439 68 L439 80 Z" fill="#2A1A1D"/><path d="M200 164 L240 164" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M248 164 L239 158 L239 170 Z" fill="#2A1A1D"/><path d="M400 164 L440 164" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M448 164 L439 158 L439 170 Z" fill="#2A1A1D"/><path d="M110 102 L110 126" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M110 134 L104 125 L116 125 Z" fill="#2A1A1D"/><rect x="250" y="232" width="150" height="56" rx="6" fill="#9C2C3A"/><text x="325" y="256" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFBFB">AES-256-CBC</text><text x="325" y="276" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFBFB">encrypts the index</text><rect x="450" y="232" width="170" height="56" rx="6" fill="#FFFBFB" stroke="#9C2C3A" stroke-width="1.5"/><text x="460" y="254" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Ciphertext</text><text x="460" y="276" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">bc6b1596...c2add</text><path d="M110 192 L110 260 L240 260" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M248 260 L239 254 L239 266 Z" fill="#2A1A1D"/><path d="M535 192 L535 212 L325 212 L325 224" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M325 230 L319 221 L331 221 Z" fill="#2A1A1D"/><path d="M400 260 L440 260" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M448 260 L439 254 L439 266 Z" fill="#2A1A1D"/><text x="20" y="316" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#6C5353">The example belongs to nobody. Use your own index, in capitals, with no spaces or hyphens.</text></svg>
