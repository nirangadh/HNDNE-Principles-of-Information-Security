<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" role="img" aria-labelledby="mr-t mr-d"><title id="mr-t">Mail is handed from relay to relay</title><desc id="mr-d">A message passes from a laptop outside Taxila, through a relay outside Taxila, to Taxila's server, mail.taxila.example. Under each machine, the message as it leaves: the relay adds one received line, and Taxila's server adds a second one above it. The from line, registrar@taxila.example, is carried along unchanged. Under the relay and under Taxila's server a cross says: did not check the from line.</desc><rect width="640" height="384" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">ONE MESSAGE, HANDED ON BY SMTP</text><rect x="20" y="50" width="190" height="62" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="115" y="76" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A1A1D">A laptop</text><text x="115" y="98" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">outside Taxila</text><path d="M212 81 L215 81" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M223 81 L214 75 L214 87 Z" fill="#9C2C3A"/><rect x="225" y="50" width="190" height="62" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="320" y="76" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A1A1D">A relay</text><text x="320" y="98" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">outside Taxila</text><path d="M417 81 L420 81" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M428 81 L419 75 L419 87 Z" fill="#9C2C3A"/><rect x="430" y="50" width="190" height="62" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="525" y="76" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A1A1D">Taxila's server</text><text x="525" y="98" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#6C5353">mail.taxila.example</text><rect x="20" y="132" width="190" height="150" rx="6" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="1.5"/><text x="30" y="152" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">The message here</text><text x="30" y="174" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">no received lines yet</text><rect x="23" y="234" width="184" height="40" rx="3" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1"/><text x="27" y="250" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A1A1D">From:</text><text x="27" y="267" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">registrar@taxila.example</text><rect x="225" y="132" width="190" height="150" rx="6" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="1.5"/><text x="235" y="152" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">The message here</text><rect x="231" y="160" width="178" height="20" rx="3" fill="#F3E2E4"/><text x="235" y="174" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">Received: from laptop</text><rect x="228" y="234" width="184" height="40" rx="3" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1"/><text x="232" y="250" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A1A1D">From:</text><text x="232" y="267" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">registrar@taxila.example</text><rect x="430" y="132" width="190" height="150" rx="6" fill="#FFFBFB" stroke="#BFA6A8" stroke-width="1.5"/><text x="440" y="152" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">The message here</text><rect x="436" y="160" width="178" height="20" rx="3" fill="#F3E2E4"/><text x="440" y="174" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">Received: from relay</text><rect x="436" y="182" width="178" height="20" rx="3" fill="#F3E2E4"/><text x="440" y="196" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">Received: from laptop</text><rect x="433" y="234" width="184" height="40" rx="3" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1"/><text x="437" y="250" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A1A1D">From:</text><text x="437" y="267" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">registrar@taxila.example</text><rect x="236" y="301" width="22" height="22" rx="3" fill="#E0663C"/><path d="M242 307 L252 317 M252 307 L242 317" stroke="#2A1A1D" stroke-width="2.5"/><text x="267" y="316" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">did not check the from line</text><rect x="441" y="301" width="22" height="22" rx="3" fill="#E0663C"/><path d="M447 307 L457 317 M457 307 L447 317" stroke="#2A1A1D" stroke-width="2.5"/><text x="472" y="316" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">did not check the from line</text><text x="20" y="312" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">The sender wrote</text><text x="20" y="328" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">the from line.</text><text x="20" y="356" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">Each relay adds its received line at the top and passes the message on.</text><text x="20" y="373" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">Nobody checks who wrote the from line.</text></svg>
