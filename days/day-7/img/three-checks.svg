<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="tc-t tc-d"><title id="tc-t">Three checks, and the domain's rule for failures</title><desc id="tc-d">Three checks in turn. SPF asks whether the sending server is on the domain's list; taxila.example lists only its own mail server. DKIM asks whether the signature verifies with the domain's public key, published at mail._domainkey.taxila.example. DMARC asks whether the from line's domain matches a check that passed, and then applies the domain's policy. Below, the three policies: none, deliver and report; quarantine, hold it apart; reject, refuse it.</desc><rect width="640" height="400" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">WHAT THE RECEIVING SERVER CHECKS</text><rect x="20" y="52" width="110" height="70" rx="10" fill="#9C2C3A"/><text x="75" y="94" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFBFB">SPF</text><rect x="140" y="52" width="480" height="70" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="156" y="80" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">Is the sending server on the domain's list?</text><text x="156" y="104" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#6C5353">taxila.example lists only its own mail server</text><path d="M75 124 L75 134" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M75 142 L69 133 L81 133 Z" fill="#2A1A1D"/><rect x="20" y="144" width="110" height="70" rx="10" fill="#9C2C3A"/><text x="75" y="186" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFBFB">DKIM</text><rect x="140" y="144" width="480" height="70" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="156" y="172" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">Does the signature verify with the domain's public key?</text><text x="156" y="196" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#6C5353">the key is at mail._domainkey.taxila.example</text><path d="M75 216 L75 226" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M75 234 L69 225 L81 225 Z" fill="#2A1A1D"/><rect x="20" y="236" width="110" height="70" rx="10" fill="#2A1A1D"/><text x="75" y="278" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFBFB">DMARC</text><rect x="140" y="236" width="480" height="70" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="156" y="264" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">Does the from line's domain match a check that passed?</text><text x="156" y="288" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">then apply the policy: none, quarantine or reject</text><rect x="20" y="332" width="190" height="52" rx="26" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="2"/><text x="115" y="354" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">p=none</text><text x="115" y="372" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">deliver, and report</text><rect x="225" y="332" width="190" height="52" rx="26" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="2"/><text x="320" y="354" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">p=quarantine</text><text x="320" y="372" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">hold it apart</text><rect x="430" y="332" width="190" height="52" rx="26" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="2"/><text x="525" y="354" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">p=reject</text><text x="525" y="372" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">refuse it</text></svg>
