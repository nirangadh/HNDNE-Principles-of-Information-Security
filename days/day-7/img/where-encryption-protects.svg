<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="we-t we-d"><title id="we-t">Where encryption protects, and where it does not</title><desc id="we-d">A grade record in three places. On the disk and the backup, a stolen disk could be read; encryption at rest protects it, shown with a tick. On the network, someone on the path could read it; encryption in transit protects it, shown with a tick. In a live query, anyone with the portal's password could read it; neither kind of encryption protects it, shown with a cross, because the database decrypts for any account allowed to read. Only the account's grants and the log cover that place.</desc><rect width="640" height="360" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">ONE GRADE RECORD, THREE PLACES</text><rect x="20" y="48" width="190" height="230" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="115" y="76" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">On disk and backup</text><rect x="40" y="92" width="150" height="40" rx="4" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="115" y="117" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">student01 M2 64</text><text x="34" y="160" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">Who could read it:</text><text x="34" y="178" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">a stolen disk or backup</text><text x="34" y="222" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">What protects it:</text><circle cx="46" cy="250" r="11" fill="#9C2C3A"/><path d="M41 250 L45 254 L52 246" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="64" y="255" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">Encryption at rest</text><rect x="225" y="48" width="190" height="230" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="320" y="76" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">On the network</text><rect x="245" y="92" width="150" height="40" rx="4" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="320" y="117" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">student01 M2 64</text><text x="239" y="160" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">Who could read it:</text><text x="239" y="178" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">someone on the path</text><text x="239" y="222" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">What protects it:</text><circle cx="251" cy="250" r="11" fill="#9C2C3A"/><path d="M246 250 L250 254 L257 246" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="269" y="255" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">Encryption in transit</text><rect x="430" y="48" width="190" height="230" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="525" y="76" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">In a live query</text><rect x="450" y="92" width="150" height="40" rx="4" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="525" y="117" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">student01 M2 64</text><text x="444" y="160" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">Who could read it:</text><text x="444" y="178" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">anyone with the</text><text x="444" y="194" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">portal's password</text><text x="444" y="222" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">What protects it:</text><rect x="445" y="239" width="22" height="22" rx="3" fill="#E0663C"/><path d="M451 245 L461 255 M461 245 L451 255" stroke="#2A1A1D" stroke-width="2.5"/><text x="474" y="255" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">Neither lock</text><rect x="430" y="290" width="190" height="56" rx="8" fill="#FFFBFB" stroke="#E0663C" stroke-width="2.5" stroke-dasharray="6 4"/><text x="442" y="312" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">The database decrypts for</text><text x="442" y="330" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">any account allowed to read.</text><text x="20" y="312" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">Each lock covers one place.</text><text x="20" y="332" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">A live, authorised query is covered</text><text x="20" y="350" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">only by least privilege and the log.</text></svg>
