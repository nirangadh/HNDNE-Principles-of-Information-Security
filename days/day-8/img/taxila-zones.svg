<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="tz-t tz-d"><title id="tz-t">Taxila's networks in zones</title><desc id="tz-d">At the top, the internet and, beside it, the Kandy campus with one rack. Below the internet, the outer firewall, which lets the public reach the demilitarised zone only. The demilitarised zone holds www.taxila.example, mail.taxila.example and pay.taxila.example. Below it, the inner firewall. Behind the inner firewall, three inside zones side by side: the staff network with college computers; the server room with sis.taxila.example, lms.taxila.example and the exam paper store; and the student Wi-Fi with unmanaged phones and laptops, drawn dashed as the least trusted zone. An encrypted tunnel runs from the Kandy campus down to the inner firewall.</desc><rect width="640" height="480" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">TAXILA'S NETWORK, IN ZONES</text><rect x="20" y="44" width="470" height="50" rx="10" fill="#FBF6F6" stroke="#6C5353" stroke-width="2"/><text x="255" y="74" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">The internet</text><rect x="500" y="44" width="120" height="50" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="560" y="66" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Kandy campus</text><text x="560" y="84" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">one rack</text><rect x="20" y="108" width="470" height="14" rx="3" fill="#9C2C3A"/><text x="255" y="140" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">Outer firewall: the public may reach the DMZ only</text><path d="M255 94 L255 98" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M255 106 L249 97 L261 97 Z" fill="#2A1A1D"/><rect x="20" y="150" width="470" height="74" rx="10" fill="#F3E2E4" stroke="#9C2C3A" stroke-width="3"/><text x="32" y="172" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">Demilitarised zone (DMZ): public servers</text><rect x="30" y="184" width="146" height="28" rx="4" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="103" y="203" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">www.taxila.example</text><rect x="182" y="184" width="146" height="28" rx="4" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="255" y="203" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">mail.taxila.example</text><rect x="334" y="184" width="146" height="28" rx="4" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="1.5"/><text x="407" y="203" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">pay.taxila.example</text><rect x="20" y="238" width="600" height="14" rx="3" fill="#2A1A1D"/><text x="240" y="270" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">Inner firewall: the DMZ and the Wi-Fi reach only what they need</text><rect x="20" y="282" width="188" height="120" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="32" y="304" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">Staff network</text><text x="32" y="328" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">college computers</text><rect x="226" y="282" width="188" height="120" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="238" y="304" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">Server room</text><text x="238" y="328" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">sis.taxila.example</text><text x="238" y="348" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">lms.taxila.example</text><text x="238" y="368" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">exam paper store</text><rect x="432" y="282" width="188" height="120" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2" stroke-dasharray="7 5"/><text x="444" y="304" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">Student Wi-Fi</text><text x="444" y="328" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">unmanaged phones</text><text x="444" y="348" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">and laptops</text><path d="M560 94 L560 230" stroke="#9C2C3A" stroke-width="10" fill="none"/><path d="M560 94 L560 230" stroke="#FFFBFB" stroke-width="4" fill="none" stroke-dasharray="8 6"/><text x="574" y="150" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">encrypted</text><text x="574" y="166" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">tunnel</text><text x="574" y="182" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">(VPN)</text><text x="20" y="428" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">A broken public server stays in the DMZ: the inner firewall still stands.</text><text x="20" y="448" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">The Wi-Fi zone, dashed, is the least trusted inside zone.</text><text x="20" y="468" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">Kandy's traffic crosses the internet only inside the tunnel.</text></svg>
