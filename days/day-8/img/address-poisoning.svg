<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" role="img" aria-labelledby="ap-t ap-d"><title id="ap-t">One true reply, then one false reply</title><desc id="ap-d">Three machines on Taxila's staff network: a lecturer's laptop, the gateway, and another machine, each with its hardware address. Frame 1: the laptop asks everyone who has the gateway's address; the cache has no entry yet. Frame 2: the gateway replies with its own hardware address, ending 00:01, and the cache stores it, shown with a tick. Frame 6: the other machine sends an unasked reply giving its own hardware address, ending 00:42, for the gateway's address, and the cache changes, shown with a cross. Frame 7: the laptop's next request goes to that machine, which passes it on to the gateway.</desc><rect width="640" height="448" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">ONE NETWORK SEGMENT, ONE ADDRESS CACHE</text><rect x="20" y="46" width="190" height="72" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="115" y="70" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">A lecturer's laptop</text><text x="115" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">staff network</text><text x="115" y="108" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#6C5353">02:00:0a:0a:00:15</text><rect x="225" y="46" width="190" height="72" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="320" y="70" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">The gateway</text><text x="320" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">staff network</text><text x="320" y="108" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#6C5353">02:00:0a:0a:00:01</text><rect x="430" y="46" width="190" height="72" rx="10" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><text x="525" y="70" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">Another machine</text><text x="525" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">same network</text><text x="525" y="108" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#6C5353">02:00:0a:0a:00:42</text><text x="20" y="148" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">Frame</text><text x="80" y="148" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">What happens</text><text x="430" y="148" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">The laptop's cache</text><rect x="20" y="160" width="600" height="52" rx="8" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="2"/><text x="40" y="192" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#9C2C3A">1</text><text x="80" y="182" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Laptop asks everyone:</text><text x="80" y="200" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">Who has the gateway's address?</text><text x="430" y="192" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">no entry yet</text><rect x="20" y="222" width="600" height="52" rx="8" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="2"/><text x="40" y="254" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#9C2C3A">2</text><text x="80" y="244" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Gateway replies:</text><text x="80" y="262" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">it is at ...:00:01</text><circle cx="442" cy="248" r="11" fill="#9C2C3A"/><path d="M437 248 L441 252 L448 244" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="460" y="253" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">gateway = ...:00:01</text><rect x="20" y="284" width="600" height="52" rx="8" fill="#F9EFEF" stroke="#E0663C" stroke-width="2" stroke-dasharray="6 4"/><text x="40" y="316" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#9C2C3A">6</text><text x="80" y="306" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Another machine, unasked:</text><text x="80" y="324" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">the gateway is at ...:00:42</text><rect x="431" y="299" width="22" height="22" rx="3" fill="#E0663C"/><path d="M437 305 L447 315 M447 305 L437 315" stroke="#2A1A1D" stroke-width="2.5"/><text x="460" y="315" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">gateway = ...:00:42</text><rect x="20" y="346" width="600" height="52" rx="8" fill="#F9EFEF" stroke="#E0663C" stroke-width="2" stroke-dasharray="6 4"/><text x="40" y="378" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#9C2C3A">7</text><text x="80" y="368" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Laptop's next request goes to</text><text x="80" y="386" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">...:00:42, which passes it on</text><rect x="431" y="361" width="22" height="22" rx="3" fill="#E0663C"/><path d="M437 367 L447 377 M447 367 L437 377" stroke="#2A1A1D" stroke-width="2.5"/><text x="460" y="377" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A1A1D">gateway = ...:00:42</text><text x="20" y="420" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">ARP believes any reply. The cache keeps whichever came last.</text><text x="20" y="439" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">A defender sees one address answered for by two hardware addresses.</text></svg>
