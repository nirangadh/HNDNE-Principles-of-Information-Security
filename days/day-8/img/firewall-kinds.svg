<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" role="img" aria-labelledby="fk-t fk-d"><title id="fk-t">Three kinds of firewall</title><desc id="fk-d">Three firewall kinds side by side. The packet filter checks addresses and ports. The stateful firewall also keeps a connection table. The application-layer firewall also reads the content. Four kinds of traffic: a student opening the portal is let through by all three, as it should be. A flood of fake replies gets through the packet filter and is stopped by the other two. An injection string over plain web gets through the first two and is stopped only by the application layer. An injection string inside encryption gets through the first two, and the application layer cannot read it unless it ends the encryption itself, shown with a dashed question mark.</desc><rect width="640" height="432" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">WHAT EACH KIND OF FIREWALL CAN CHECK</text><rect x="236" y="44" width="126" height="34" rx="6" fill="#9C2C3A"/><text x="299" y="66" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFBFB">Packet filter</text><text x="242" y="98" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">addresses and ports</text><rect x="370" y="44" width="126" height="34" rx="6" fill="#9C2C3A"/><text x="433" y="66" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFBFB">Stateful</text><text x="376" y="98" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">addresses and ports</text><text x="376" y="114" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">+ connection table</text><rect x="504" y="44" width="126" height="34" rx="6" fill="#2A1A1D"/><text x="567" y="66" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFBFB">Application layer</text><text x="510" y="98" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">addresses and ports</text><text x="510" y="114" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">+ connection table</text><text x="510" y="130" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">+ the content</text><rect x="20" y="162" width="600" height="46" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="30" y="182" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">A student opens the portal</text><text x="30" y="199" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">let through, as it should</text><circle cx="299" cy="185" r="11" fill="#6C5353"/><path d="M294 185 L298 189 L305 181" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><circle cx="433" cy="185" r="11" fill="#6C5353"/><path d="M428 185 L432 189 L439 181" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><circle cx="567" cy="185" r="11" fill="#6C5353"/><path d="M562 185 L566 189 L573 181" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><rect x="20" y="216" width="600" height="46" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="30" y="236" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">A flood of fake replies</text><text x="30" y="253" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">dropped once state is kept</text><rect x="288" y="228" width="22" height="22" rx="3" fill="#E0663C"/><path d="M294 234 L304 244 M304 234 L294 244" stroke="#2A1A1D" stroke-width="2.5"/><circle cx="433" cy="239" r="11" fill="#9C2C3A"/><path d="M428 239 L432 243 L439 235" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><circle cx="567" cy="239" r="11" fill="#9C2C3A"/><path d="M562 239 L566 243 L573 235" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><rect x="20" y="270" width="600" height="46" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="30" y="290" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Injection string, plain web</text><text x="30" y="307" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">dropped once content is read</text><rect x="288" y="282" width="22" height="22" rx="3" fill="#E0663C"/><path d="M294 288 L304 298 M304 288 L294 298" stroke="#2A1A1D" stroke-width="2.5"/><rect x="422" y="282" width="22" height="22" rx="3" fill="#E0663C"/><path d="M428 288 L438 298 M438 288 L428 298" stroke="#2A1A1D" stroke-width="2.5"/><circle cx="567" cy="293" r="11" fill="#9C2C3A"/><path d="M562 293 L566 297 L573 289" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><rect x="20" y="324" width="600" height="46" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="30" y="344" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">Injection inside encryption</text><text x="30" y="361" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">unread unless it ends it</text><rect x="288" y="336" width="22" height="22" rx="3" fill="#E0663C"/><path d="M294 342 L304 352 M304 342 L294 352" stroke="#2A1A1D" stroke-width="2.5"/><rect x="422" y="336" width="22" height="22" rx="3" fill="#E0663C"/><path d="M428 342 L438 352 M438 342 L428 352" stroke="#2A1A1D" stroke-width="2.5"/><rect x="556" y="336" width="22" height="22" rx="3" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="2" stroke-dasharray="4 3"/><text x="583" y="352" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A1A1D">?</text><text x="20" y="392" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">A tick means the unwanted item is stopped; a cross means it gets through.</text><text x="20" y="412" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">None of them reads inside encryption it does not end itself.</text></svg>
