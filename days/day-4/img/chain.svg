<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="ch-t ch-d"><title id="ch-t">The chain of trust</title><desc id="ch-d">Three certificates, one above another. The end-entity certificate for sis.taxila.example is signed by the intermediate authority. The intermediate certificate is signed by the root authority. The root certificate signs itself and sits inside the browser's trust store, so the chain is trusted. To the right, a self-signed certificate for sis.taxila.example names itself as issuer and is in no trust store.</desc><rect width="640" height="400" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">THE CHAIN OF TRUST</text><rect x="20" y="44" width="380" height="96" rx="10" fill="#F9EFEF" stroke="#9C2C3A" stroke-width="2" stroke-dasharray="6 4"/><text x="36" y="66" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">The browser's trust store</text><rect x="40" y="74" width="340" height="58" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="54" y="98" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">Root certificate</text><text x="54" y="119" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">subject: Root authority; signed with its own key</text><path d="M210 210 L210 148" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M210 140 L204 149 L216 149 Z" fill="#9C2C3A"/><text x="222" y="182" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">signed by</text><rect x="40" y="210" width="340" height="58" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="54" y="234" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">Intermediate certificate</text><text x="54" y="255" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">subject: Intermediate authority</text><path d="M210 330 L210 276" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M210 268 L204 277 L216 277 Z" fill="#9C2C3A"/><text x="222" y="304" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">signed by</text><rect x="40" y="330" width="340" height="58" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="54" y="354" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">End-entity certificate</text><text x="54" y="375" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">subject: sis.taxila.example</text><rect x="430" y="210" width="190" height="120" rx="6" fill="#FBF6F6" stroke="#E0663C" stroke-width="2" stroke-dasharray="8 5"/><text x="444" y="234" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">Self-signed</text><text x="444" y="254" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">subject: sis.taxila.example</text><text x="444" y="272" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">issuer: sis.taxila.example</text><path d="M560 290 Q600 290 600 262 Q600 236 572 236" stroke="#6C5353" stroke-width="2" fill="none"/><rect x="445" y="294" width="22" height="22" rx="3" fill="#E0663C"/><path d="M451 300 L461 310 M461 300 L451 310" stroke="#2A1A1D" stroke-width="2.5"/><text x="474" y="310" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">in no trust store</text><circle cx="430" cy="90" r="11" fill="#9C2C3A"/><path d="M425 90 L429 94 L436 86" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="448" y="86" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">trusted: the chain</text><text x="448" y="102" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">ends at a root</text></svg>
