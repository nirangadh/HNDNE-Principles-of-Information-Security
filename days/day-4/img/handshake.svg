<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="hs-t hs-d"><title id="hs-t">The handshake in four moves</title><desc id="hs-d">Browser on the left, server on the right. One: the browser says hello and sends its public share. Two: the server sends its own share, and both sides compute the same session key. Three: the server sends its certificate and signs the handshake with its private key; the browser walks the chain of trust and checks the signature. Four: everything after this is encrypted with the session key, which never travelled.</desc><rect width="640" height="420" fill="#FFFBFB"/><rect x="20" y="20" width="150" height="40" rx="8" fill="#2A1A1D"/><text x="95" y="46" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFBFB">Browser</text><rect x="470" y="20" width="150" height="40" rx="8" fill="#2A1A1D"/><text x="545" y="46" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFBFB">Server</text><path d="M95 60 L95 400 M545 60 L545 400" stroke="#BFA6A8" stroke-width="3" stroke-dasharray="6 6"/><text x="20" y="92" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#9C2C3A">1</text><path d="M103 118 L529 118" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M537 118 L528 112 L528 124 Z" fill="#9C2C3A"/><text x="320" y="94" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">Hello, and my public share</text><text x="320" y="110" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">the versions and methods I can use</text><text x="20" y="162" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#9C2C3A">2</text><path d="M537 188 L111 188" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M103 188 L112 182 L112 194 Z" fill="#9C2C3A"/><text x="320" y="164" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">My public share</text><text x="320" y="180" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">both sides now compute the same session key</text><text x="20" y="232" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#9C2C3A">3</text><path d="M537 258 L111 258" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M103 258 L112 252 L112 264 Z" fill="#9C2C3A"/><text x="320" y="234" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A1A1D">My certificate, and the handshake signed</text><text x="320" y="250" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">with my private key</text><rect x="150" y="270" width="340" height="40" rx="6" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="1.5"/><text x="320" y="288" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">Browser walks the chain of trust, then checks</text><text x="320" y="303" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A1A1D">the signature with the certificate's public key</text><text x="20" y="340" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#9C2C3A">4</text><rect x="103" y="328" width="434" height="44" rx="8" fill="#9C2C3A"/><path d="M124.4 352 L124.4 345.6 Q124.4 339.2 130 339.2 Q135.6 339.2 135.6 345.6 L135.6 352" stroke="#FFFBFB" stroke-width="2.4" fill="none"/><rect x="121.2" y="352" width="17.6" height="12.8" rx="2.4" fill="#FFFBFB"/><text x="330" y="347" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFBFB">Everything after this is encrypted</text><text x="330" y="364" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFBFB">with the session key, which never travelled</text><text x="20" y="404" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#9C2C3A">The session key is agreed in the open; the certificate and signature prove whose server it is.</text></svg>
