<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="ps-t ps-d"><title id="ps-t">Plain web against secure web</title><desc id="ps-d">Two captures side by side. On the left, plain web: the request POST /submit is readable, ending with the line index=COHNDNE999X000. On the right, secure web: Client Hello, Server Hello, then only Application Data records of scrambled bytes, and the index number is found in no packet.</desc><rect width="640" height="330" fill="#FFFBFB"/><rect x="12" y="12" width="300" height="270" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><rect x="328" y="12" width="300" height="270" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="162" y="40" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#2A1A1D">PLAIN WEB, FILTER http</text><text x="478" y="40" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#2A1A1D">SECURE WEB, FILTER tls</text><text x="30" y="74" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">POST /submit HTTP/1.1</text><text x="30" y="96" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">Host: 127.0.0.1:8080</text><text x="30" y="118" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">Content-Type: application/</text><text x="30" y="140" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">  x-www-form-urlencoded</text><text x="30" y="162" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D"></text><rect x="24" y="168" width="200" height="22" rx="3" fill="#F3E2E4" stroke="#9C2C3A" stroke-width="2"/><text x="30" y="184" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">index=COHNDNE999X000</text><rect x="23" y="225" width="22" height="22" rx="3" fill="#E0663C"/><path d="M29 231 L39 241 M39 231 L29 241" stroke="#2A1A1D" stroke-width="2.5"/><text x="52" y="241" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">your index, readable by anyone</text><text x="52" y="259" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">who can see the traffic</text><text x="344" y="74" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">Client Hello</text><text x="344" y="96" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">Server Hello</text><text x="344" y="118" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">Application Data</text><text x="344" y="140" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">Application Data</text><text x="344" y="162" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#2A1A1D">Application Data</text><text x="344" y="192" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">17 03 03 03 46 fb ca 99 e5 ce</text><text x="344" y="212" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="400" fill="#6C5353">62 c6 c5 26 94 c6 14 bf 67 b9</text><circle cx="350" cy="236" r="11" fill="#9C2C3A"/><path d="M345 236 L349 240 L356 232" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="368" y="241" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">index not found in any packet</text><text x="368" y="259" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">only encrypted bytes</text><text x="20" y="312" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">The same form, sent twice from the same browser. Only the encryption differs.</text></svg>
