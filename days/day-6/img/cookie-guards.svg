<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="cg-t cg-d"><title id="cg-t">Three gaps, three guards</title><desc id="cg-d">A session cookie inside the browser, with three paths leading away from it: a script on the page, a plain connection, and a request started by another site. Each path ends at a closed gate labelled with the attribute that closes it: HttpOnly hides the cookie from every script, Secure sends it only when encrypted, and SameSite leaves it off a request that another site started.</desc><rect width="640" height="400" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">THREE GAPS, THREE GUARDS</text><rect x="20" y="50" width="170" height="320" rx="12" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><rect x="20" y="50" width="170" height="32" rx="12" fill="#2A1A1D"/><rect x="20" y="70" width="170" height="12" fill="#2A1A1D"/><text x="105" y="72" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFBFB">Your browser</text><circle cx="105" cy="192" r="34" fill="#E4D5D5" stroke="#6C5353" stroke-width="2"/><circle cx="93.1" cy="181.8" r="4.1" fill="#6C5353"/><circle cx="115.2" cy="203.9" r="4.1" fill="#6C5353"/><circle cx="118.6" cy="183.5" r="3.4" fill="#6C5353"/><text x="105" y="250" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">the session cookie</text><text x="105" y="270" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#9C2C3A">session=7f3a9c...</text><text x="105" y="300" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">Whoever holds it</text><text x="105" y="316" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">is you.</text><path d="M196 118 L412 118" stroke="#6C5353" stroke-width="2.5" fill="none"/><path d="M420 118 L411 112 L411 124 Z" fill="#6C5353"/><text x="212" y="92" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">A script on the page</text><text x="212" y="108" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">tries to read it</text><rect x="424" y="80" width="196" height="76" rx="10" fill="#FFFBFB" stroke="#9C2C3A" stroke-width="3"/><rect x="424" y="80" width="12" height="76" rx="4" fill="#9C2C3A"/><text x="450" y="108" text-anchor="start" font-family="Courier New, monospace" font-size="16" font-weight="800" fill="#9C2C3A">HttpOnly</text><text x="450" y="132" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">hidden from every script</text><circle cx="598" cy="102" r="11" fill="#9C2C3A"/><path d="M593 102 L597 106 L604 98" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><path d="M196 222 L412 222" stroke="#6C5353" stroke-width="2.5" fill="none"/><path d="M420 222 L411 216 L411 228 Z" fill="#6C5353"/><text x="212" y="196" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">A plain connection</text><text x="212" y="212" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">would carry it unencrypted</text><rect x="424" y="184" width="196" height="76" rx="10" fill="#FFFBFB" stroke="#9C2C3A" stroke-width="3"/><rect x="424" y="184" width="12" height="76" rx="4" fill="#9C2C3A"/><text x="450" y="212" text-anchor="start" font-family="Courier New, monospace" font-size="16" font-weight="800" fill="#9C2C3A">Secure</text><text x="450" y="236" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">sent only when encrypted</text><circle cx="598" cy="206" r="11" fill="#9C2C3A"/><path d="M593 206 L597 210 L604 202" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><path d="M196 326 L412 326" stroke="#6C5353" stroke-width="2.5" fill="none"/><path d="M420 326 L411 320 L411 332 Z" fill="#6C5353"/><text x="212" y="300" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A1A1D">A request another site</text><text x="212" y="316" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">started would carry it</text><rect x="424" y="288" width="196" height="76" rx="10" fill="#FFFBFB" stroke="#9C2C3A" stroke-width="3"/><rect x="424" y="288" width="12" height="76" rx="4" fill="#9C2C3A"/><text x="450" y="316" text-anchor="start" font-family="Courier New, monospace" font-size="16" font-weight="800" fill="#9C2C3A">SameSite</text><text x="450" y="340" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">left off that request</text><circle cx="598" cy="310" r="11" fill="#9C2C3A"/><path d="M593 310 L597 314 L604 306" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="20" y="392" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#9C2C3A">Each attribute closes one gap. No single attribute closes all three.</text></svg>
