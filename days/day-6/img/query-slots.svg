<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-labelledby="qs-t qs-d"><title id="qs-t">Two ways to build the login query</title><desc id="qs-d">Two panels. On the left, a query built by joining text: the value sits inside the query and can become part of it, so every record comes back. On the right, a parameterised query: a placeholder in the query and the value kept beside it as data, so the value cannot change the query.</desc><rect width="620" height="300" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">TWO WAYS TO BUILD THE LOGIN QUERY</text><rect x="20" y="50" width="280" height="230" rx="12" fill="#FBF6F6" stroke="#E0663C" stroke-width="2"/><text x="36" y="78" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#E0663C">Joined into the query text</text><rect x="36" y="96" width="248" height="60" rx="8" fill="#FFFBFB" stroke="#6C5353" stroke-width="1.5"/><text x="48" y="122" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A1A1D">WHERE username =</text><rect x="48" y="130" width="228" height="18" fill="#E0663C" opacity="0.25"/><text x="48" y="144" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#E0663C">the value, part of the query</text><text x="36" y="186" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">The input is inside the query.</text><text x="36" y="206" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">Part of it can become a</text><text x="36" y="224" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">condition that is always true.</text><text x="36" y="254" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#E0663C">Every record comes back.</text><rect x="320" y="50" width="280" height="230" rx="12" fill="#FBF6F6" stroke="#9C2C3A" stroke-width="2"/><text x="336" y="78" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#9C2C3A">A parameterised query</text><rect x="336" y="96" width="248" height="40" rx="8" fill="#FFFBFB" stroke="#6C5353" stroke-width="1.5"/><text x="348" y="121" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A1A1D">WHERE username = </text><rect x="520" y="103" width="28" height="30" rx="6" fill="#F9EFEF" stroke="#9C2C3A" stroke-width="2"/><text x="530" y="123" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">?</text><rect x="336" y="160" width="140" height="34" rx="8" fill="#F9EFEF" stroke="#9C2C3A" stroke-width="1.5"/><text x="348" y="182" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#9C2C3A">the value: data</text><path d="M478 177 L540 177" stroke="#9C2C3A" stroke-width="2.5" fill="none"/><path d="M548 177 L539 171 L539 183 Z" fill="#9C2C3A"/><path d="M534 120 C560 130 560 165 548 177" stroke="#9C2C3A" stroke-width="2" fill="none" stroke-dasharray="4 4"/><text x="336" y="222" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">The value travels beside the</text><text x="336" y="240" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1A1D">query, so it cannot change it.</text><text x="336" y="266" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#9C2C3A">The crafted login matches nothing.</text></svg>
