<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="cd-t cd-d"><title id="cd-t">Data, or command</title><desc id="cd-d">A fixed instruction with a blank for a student number. In the top panel the value fills the blank and is read as data. In the bottom panel the value runs past the blank and joins the instruction, so it is read as a command: this is injection.</desc><rect width="600" height="330" fill="#FFFBFB"/><text x="20" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">DATA, OR COMMAND</text><rect x="20" y="48" width="560" height="112" rx="12" fill="#FBF6F6" stroke="#6C5353" stroke-width="1.5"/><text x="36" y="74" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#9C2C3A">Kept as data</text><text x="36" y="104" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1A1D">Show the record for student number</text><rect x="330" y="88" width="96" height="30" rx="6" fill="#F9EFEF" stroke="#9C2C3A" stroke-width="2"/><text x="340" y="108" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">TC2003</text><text x="432" y="104" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1A1D">.</text><circle cx="548" cy="104" r="11" fill="#9C2C3A"/><path d="M543 104 L547 108 L554 100" stroke="#FFFBFB" stroke-width="2.5" fill="none"/><text x="36" y="142" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">The value fills the blank. The instruction is unchanged.</text><rect x="20" y="176" width="560" height="136" rx="12" fill="#FBF6F6" stroke="#E0663C" stroke-width="2"/><text x="36" y="202" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#E0663C">Read as command</text><text x="36" y="232" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1A1D">Show the record for student number</text><rect x="300" y="216" width="84" height="30" rx="6" fill="#F9EFEF" stroke="#9C2C3A" stroke-width="2"/><text x="310" y="236" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#2A1A1D">TC2003</text><path d="M390 192 L390 262" stroke="#6C5353" stroke-width="1.5" stroke-dasharray="4 4"/><text x="390" y="184" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#6C5353">end of the blank</text><rect x="396" y="216" width="180" height="30" rx="6" fill="#E0663C" stroke="#E0663C" stroke-width="2"/><text x="406" y="236" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFFBFB">and show all records</text><text x="36" y="286" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#6C5353">The value runs past the blank and joins the instruction.</text><text x="36" y="304" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#E0663C">Now the application is told to show every record. This is injection.</text></svg>
