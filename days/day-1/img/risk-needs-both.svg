<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="rb-t rb-d"><title id="rb-t">Risk needs both a threat and a vulnerability</title><desc id="rb-d">Three panels. In the first, the asset (exam papers), the threat (a curious student) and the vulnerability (a folder anyone can open) are all present, giving a risk of 3 times 5, 15. In the second the threat is removed and in the third the weakness is closed; both show no risk, and no row needed.</desc><rect width="640" height="360" fill="#FFFBFB"/><rect x="12" y="12" width="198" height="336" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="111" y="40" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A1A1D">All three present</text><rect x="26" y="60" width="170" height="50" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="2"/><text x="38" y="81" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#9C2C3A">ASSET</text><text x="38" y="100" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#2A1A1D">exam papers</text><rect x="26" y="122" width="170" height="50" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="2"/><text x="38" y="143" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#9C2C3A">THREAT</text><text x="38" y="162" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#2A1A1D">a curious student</text><rect x="26" y="184" width="170" height="50" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="2"/><text x="38" y="205" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#9C2C3A">VULNERABILITY</text><text x="38" y="224" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#2A1A1D">a folder anyone opens</text><path d="M111 236 L111 254" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M111 262 L105 253 L117 253 Z" fill="#2A1A1D"/><rect x="26" y="264" width="170" height="70" rx="8" fill="#9C2C3A"/><text x="111" y="294" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFBFB">Risk 3 x 5 = 15</text><text x="111" y="318" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#FFFBFB">likelihood x impact</text><rect x="222" y="12" width="198" height="336" rx="10" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="321" y="40" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A1A1D">Threat removed</text><rect x="236" y="60" width="170" height="50" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="2"/><text x="248" y="81" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#9C2C3A">ASSET</text><text x="248" y="100" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#2A1A1D">exam papers</text><rect x="236" y="122" width="170" height="50" rx="6" fill="#FFFBFB" stroke="#E0663C" stroke-width="2" stroke-dasharray="6 5"/><text x="248" y="143" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#6C5353">THREAT</text><text x="248" y="162" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#6C5353">removed</text><rect x="378" y="134" width="22" height="22" rx="3" fill="#E0663C"/><text x="389" y="151" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#2A1A1D">×</text><rect x="236" y="184" width="170" height="50" rx="6" fill="#FFFBFB" stroke="#2A1A1D" stroke-width="2"/><text x="248" y="205" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#9C2C3A">VULNERABILITY</text><text x="248" y="224" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#2A1A1D">a folder anyone opens</text><path d="M321 236 L321 254" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M321 262 L315 253 L327 253 Z" fill="#2A1A1D"/><rect 