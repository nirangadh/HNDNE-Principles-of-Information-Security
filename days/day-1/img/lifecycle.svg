<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="lc-t lc-d"><title id="lc-t">The data lifecycle, followed by one grade</title><desc id="lc-d">Six numbered stages in order: create (the lecturer enters 78), store (kept in the Student Information System), process (printed on a transcript), share (sent to the student), archive (kept after graduation) and destroy (deleted when no longer needed). A note says every stage can be attacked, and that store and share are where a grade is most exposed.</desc><rect width="640" height="330" fill="#FFFBFB"/><text x="20" y="30" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">ONE GRADE, FROM START TO END</text><rect x="20" y="56" width="180" height="78" rx="8" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><circle cx="42" cy="80" r="13" fill="#9C2C3A"/><text x="42" y="85" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFBFB">1</text><text x="64" y="86" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2A1A1D">Create</text><text x="36" y="116" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#6C5353">the lecturer enters 78</text><rect x="230" y="56" width="180" height="78" rx="8" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><circle cx="252" cy="80" r="13" fill="#9C2C3A"/><text x="252" y="85" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFBFB">2</text><text x="274" y="86" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2A1A1D">Store</text><text x="246" y="116" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#6C5353">saved in the records</text><rect x="440" y="56" width="180" height="78" rx="8" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><circle cx="462" cy="80" r="13" fill="#9C2C3A"/><text x="462" y="85" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFBFB">3</text><text x="484" y="86" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2A1A1D">Process</text><text x="456" y="116" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#6C5353">printed on a transcript</text><rect x="440" y="186" width="180" height="78" rx="8" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><circle cx="462" cy="210" r="13" fill="#9C2C3A"/><text x="462" y="215" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFBFB">4</text><text x="484" y="216" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2A1A1D">Share</text><text x="456" y="246" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#6C5353">sent to the student</text><rect x="230" y="186" width="180" height="78" rx="8" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><circle cx="252" cy="210" r="13" fill="#9C2C3A"/><text x="252" y="215" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFBFB">5</text><text x="274" y="216" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2A1A1D">Archive</text><text x="246" y="246" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#6C5353">kept after graduation</text><rect x="20" y="186" width="180" height="78" rx="8" fill="#FBF6F6" stroke="#2A1A1D" stroke-width="2"/><circle cx="42" cy="210" r="13" fill="#9C2C3A"/><text x="42" y="215" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFBFB">6</text><text x="64" y="216" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2A1A1D">Destroy</text><text x="36" y="246" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#6C5353">deleted when not needed</text><path d="M200 95 L222 95" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M230 95 L221 89 L221 101 Z" fill="#2A1A1D"/><path d="M410 95 L432 95" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M440 95 L431 89 L431 101 Z" fill="#2A1A1D"/><path d="M530 134 L530 178" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M530 186 L524 177 L536 177 Z" fill="#2A1A1D"/><path d="M440 225 L418 225" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M410 225 L419 219 L419 231 Z" fill="#2A1A1D"/><path d="M230 225 L208 225" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M200 225 L209 219 L209 231 Z" fill="#2A1A1D"/><text x="20" y="306" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#9C2C3A">Every stage can be attacked.</text><text x="252" y="306" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#6C5353">For a grade, store and share are where it is most exposed.</text></svg>
