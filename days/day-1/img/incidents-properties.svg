<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="ip-t ip-d"><title id="ip-t">Which property each incident lost</title><desc id="ip-d">Four rows. A leaked exam paper lost confidentiality. A changed grade lost integrity and accountability. A dead deadline night lost availability. A message from someone pretending to be the Registrar lost authenticity.</desc><rect width="640" height="330" fill="#FFFBFB"/><text x="20" y="30" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">LAST SEMESTER</text><text x="350" y="30" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C5353">PROPERTY LOST</text><rect x="20" y="48" width="290" height="48" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="36" y="78" font-family="Open Sans, Arial, sans-serif" font-size="16" fill="#2A1A1D">A leaked exam paper</text><path d="M312 72 L338 72" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M346 72 L337 66 L337 78 Z" fill="#2A1A1D"/><rect x="350" y="48" width="270" height="48" rx="6" fill="#203A61"/><text x="362" y="79" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFBFB">C</text><text x="384" y="78" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFBFB">Confidentiality</text><rect x="20" y="114" width="290" height="48" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="36" y="144" font-family="Open Sans, Arial, sans-serif" font-size="16" fill="#2A1A1D">A changed grade</text><path d="M312 138 L338 138" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M346 138 L337 132 L337 144 Z" fill="#2A1A1D"/><rect x="350" y="114" width="118" height="48" rx="6" fill="#1E7657"/><text x="362" y="145" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFBFB">I</text><text x="384" y="144" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFBFB">Integrity</text><rect x="474" y="114" width="146" height="48" rx="6" fill="#445A67"/><text x="486" y="145" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFBFB">Ac</text><text x="518" y="144" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFBFB">Accountability</text><rect x="20" y="180" width="290" height="48" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="36" y="210" font-family="Open Sans, Arial, sans-serif" font-size="16" fill="#2A1A1D">A dead deadline night</text><path d="M312 204 L338 204" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M346 204 L337 198 L337 210 Z" fill="#2A1A1D"/><rect x="350" y="180" width="270" height="48" rx="6" fill="#7D4C15"/><text x="362" y="211" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFBFB">A</text><text x="384" y="210" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFBFB">Availability</text><rect x="20" y="246" width="290" height="48" rx="6" fill="#FBF6F6" stroke="#BFA6A8" stroke-width="1.5"/><text x="36" y="276" font-family="Open Sans, Arial, sans-serif" font-size="16" fill="#2A1A1D">A message from “the Registrar”</text><path d="M312 270 L338 270" stroke="#2A1A1D" stroke-width="2.5" fill="none"/><path d="M346 270 L337 264 L337 276 Z" fill="#2A1A1D"/><rect x="350" y="246" width="270" height="48" rx="6" fill="#6E3A99"/><text x="362" y="277" font-family="Open Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFBFB">Au</text><text x="394" y="276" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFBFB">Authenticity</text><text x="20" y="314" font-family="Open Sans, Arial, sans-serif" font-size="13" fill="#6C5353">The changed grade lost two: the value changed, and nothing recorded who changed it.</text></svg>
